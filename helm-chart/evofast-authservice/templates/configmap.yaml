apiVersion: v1
kind: ConfigMap
metadata:
  name: evofast-authservice-config
data:
  AllowedHosts: {{ .Values.config.allowedHosts | quote }}
  AllowedOrigins: {{ .Values.config.allowedOrigins | quote }}
  Logging__LogLevel__Default: {{ .Values.config.logLevelDefault | quote }}
  Logging__LogLevel__Microsoft.AspNetCore: {{ .Values.config.logLevelMicrosoft | quote }}
