  dbHangfire: "host=jastech-vn.postgres.database.azure.com;port=5432;database=AuthService_Hangfire;pooling=true;username=lieudvq0302;password=?s0D5Uip4DK{N9f6I:?g"
  brokerHost: "amqp://rabbitmq:5672"
