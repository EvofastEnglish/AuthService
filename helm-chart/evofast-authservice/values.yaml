replicaCount: 1

image:
  repository: lieusolocode/evofast-authservice-aks
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8001
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: evofast-identityserver-dev.solocode.click
  path: /
  pathType: Prefix

config:
  allowedHosts: "*"
  allowedOrigins: "http://localhost:3000;https://evofast.solocode.click;https://evofast-dev.solocode.click"
  logLevelDefault: "Information"
  logLevelMicrosoft: "Warning"

